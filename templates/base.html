<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Nifty 100 Intelligence{% endblock %}</title>
    <meta
      name="description"
      content="{% block desc %}Full financial intelligence platform for India's Nifty 100 companies.{% endblock %}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 for responsive UI -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- App JS -->
    <script src="{% static 'js/app.js' %}"></script>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="nav-container">
        <a href="/" class="nav-logo">
          <span class="logo-icon">N</span>
          <span class="logo-text"
            >Nifty<span class="logo-accent">100</span></span
          >
        </a>
        <div class="nav-links">
          <a
            href="/"
            class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
            >Markets</a
          >
          <a
            href="/screener/"
            class="nav-link {% if request.resolver_match.url_name == 'screener' %}active{% endif %}"
            >Screener</a
          >
          <a
            href="/compare/"
            class="nav-link {% if request.resolver_match.url_name == 'compare' %}active{% endif %}"
            >Compare</a
          >
          <a
            href="{% url 'powerbi_view' %}"
            class="nav-link {% if request.resolver_match.url_name == 'powerbi_view' %}active{% endif %}"
            style="color: #f2c811"
            >Power BI Dashboard</a
          >
        </div>
        <div class="nav-search-mini">
          <form action="/" method="get">
            <input
              type="text"
              name="q"
              placeholder="Search company..."
              class="mini-search"
              autocomplete="off"
            />
          </form>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content">{% block content %}{% endblock %}</main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-brand">
          <span class="logo-icon">N</span>
          <span class="footer-tagline"
            >Nifty100 Intelligence — Data-driven investing for India.</span
          >
        </div>
        <div class="footer-links">
        </div>
        <p class="footer-disclaimer">
          For educational purposes only. Not investment advice.
        </p>
      </div>
    </footer>

    {% block extra_js %}{% endblock %}
  </body>
</html>
